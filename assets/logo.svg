  </defs>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="495" height="495" rx="115.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>
  <circle cx="252" cy="266" r="150" fill="url(#moon)" mask="url(#cut)"/>
  <rect x="306" y="170" width="30" height="156" rx="15" fill="#ffffff"/>
